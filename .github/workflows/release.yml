name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.0)'
        required: true
        default: 'v2.9.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            arch_name: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The catalog is signed by the maintainer and committed together with its
      # .sig files. Do NOT re-sign here: CatalogSignatureService pins one public
      # key, so a release signed by any other key would be rejected by the app.

      - name: Restore NuGet Packages
        run: dotnet restore src/DevOpsToolsInstaller/DevOpsToolsInstaller.csproj -r ${{ matrix.rid }}

      # WinUI 3 cannot be single-file published: the app fails at startup with
      # "ClassFactory cannot supply requested class" because the Windows App SDK
      # bootstrapper must be able to resolve its neighbouring runtime files.
      # Publish a folder and ship it as a zip / installer instead.
      - name: Publish Folder Build
        run: |
          dotnet publish src/DevOpsToolsInstaller/DevOpsToolsInstaller.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=${{ matrix.platform }} -o publish_out

      - name: Resolve Version
        id: ver
        shell: pwsh
        run: |
          $ver = "0.0.0"
          if ("$env:GITHUB_REF_NAME" -match '^v?(\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $staging = "DevOpsToolsInstaller_v${ver}_${{ matrix.arch_name }}_portable"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path "publish_out\*" -Destination $staging -Recurse -Force
          Compress-Archive -Path "$staging\*" -DestinationPath "publish_out\DevOpsToolsInstaller_v${ver}_${{ matrix.arch_name }}_portable.zip" -CompressionLevel Optimal
          Remove-Item $staging -Recurse -Force

      - name: Build Windows Setup Wizard
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Host "Inno Setup 6 (ISCC.exe) not found on this runner." -ForegroundColor Red
            Write-Host "Install it with: choco install innosetup --version=6.3.1" -ForegroundColor Gray
            exit 1
          }
          Write-Host "Compiling Inno Setup wizard with $iscc..."
          $sourceDir = (Resolve-Path "publish_out").Path
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" -Force | Out-Null }
          $outDir = (Resolve-Path "dist").Path
          & $iscc "/DSourceDir=$sourceDir" "/DOutputDir=$outDir" "/DAppVersion=${{ steps.ver.outputs.version }}" "installer/setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = "${{ steps.ver.outputs.version }}"
          Move-Item -Path "dist\DevOpsToolsInstaller_v${ver}_x64_Setup.exe" -Destination "publish_out\" -Force

      - name: Sign Binaries & Installer (Authenticode)
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE) {
            Write-Host "SIGNING_CERTIFICATE secret is not set. Binaries will not be code-signed." -ForegroundColor Yellow
            Write-Host "To enable code signing, add base64-encoded PFX to repository secret 'SIGNING_CERTIFICATE'." -ForegroundColor Gray
          } else {
            $toSign = @(Get-ChildItem -Path "publish_out\*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            if ($toSign.Count -eq 0) { Write-Host "Nothing to sign."; exit 0 }
            .\scripts\sign-binaries.ps1 -Files $toSign -Base64Cert "$env:SIGNING_CERTIFICATE" -Password "$env:SIGNING_PASSWORD"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch_name }}
          path: publish_out/DevOpsToolsInstaller_v*_x64_Setup.exe
          if-no-files-found: error

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch_name }}
          path: publish_out/DevOpsToolsInstaller_v*_portable.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums and Release Notes
        shell: pwsh
        run: |
          .\.github\workflows\generate-release-notes.ps1 -Tag "${{ steps.get_tag.outputs.tag }}" -AssetsDir "release_assets" -OutputFile "release_notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            release_assets/DevOpsToolsInstaller_v*_x64_Setup.exe
            release_assets/DevOpsToolsInstaller_v*_x64_portable.zip
            release_assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
